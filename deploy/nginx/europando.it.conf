# Virtual host per europando.it.
#
# Questo file contiene solo la parte HTTP: il blocco HTTPS lo aggiunge certbot
# al primo rilascio del certificato. Spedire qui dei percorsi `ssl_certificate`
# che ancora non esistono impedirebbe a nginx di avviarsi.
#
# Installazione:
#   sudo cp deploy/nginx/europando.it.conf /etc/nginx/sites-available/europando.it
#   sudo ln -s /etc/nginx/sites-available/europando.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d europando.it -d www.europando.it
#
# Il file riguarda solo questo dominio: altri siti già presenti sul server non
# vengono toccati, a patto che nessuno di essi sia il default_server.

server {
    listen 80;
    listen [::]:80;
    server_name europando.it www.europando.it;

    # `current` è un symlink alla versione pubblicata: lo scambio a fine deploy
    # è atomico, quindi nessun visitatore vede il sito a metà aggiornamento.
    root /var/www/europando/current;
    index index.html;

    # Ogni pagina pubblicata è una cartella con index.html. `=404` restituisce
    # un vero 404, non un 200 con la pagina di errore dentro: è la differenza
    # che conta per Google.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # I file in assets/ hanno l'hash del contenuto nel nome: se cambiano, cambia
    # il nome. Possono restare in cache per sempre.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # L'HTML invece cambia a ogni pubblicazione e non va mai messo in cache.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # Le immagini sono servite col nome originale: cache breve, così sostituirne
    # una non richiede di cambiarle nome.
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # I file nascosti non hanno motivo di essere raggiungibili.
    location ~ /\. {
        deny all;
    }
}
